      .subtitle { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 24px; fill: #5EEAD4; letter-spacing: 0.5px; }
      .tags { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, 'SF Mono', monospace; font-weight: 500; font-size: 15px; fill: #CBD5E1; }
